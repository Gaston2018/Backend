<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; padding: 2rem; }
    .container { width: 100%; max-width: 640px; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 1.5rem; font-size: 2rem; }
    .form-card { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    .form-card input, .form-card textarea {
      width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem;
      border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;
    }
    .form-card button {
      width: 100%; padding: 0.7rem; background: #3498db; color: #fff;
      border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;
    }
    .form-card button:hover { background: #2980b9; }
    .task-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .task-card {
      background: #fff; border-radius: 10px; padding: 1rem 1.2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex;
      align-items: flex-start; gap: 1rem;
    }
    .task-card.completed .task-title { text-decoration: line-through; color: #999; }
    .task-card input[type=checkbox] { margin-top: 4px; width: 18px; height: 18px; cursor: pointer; }
    .task-info { flex: 1; }
    .task-title { font-weight: 600; color: #2c3e50; font-size: 1rem; }
    .task-desc { color: #666; font-size: 0.875rem; margin-top: 2px; }
    .task-actions { display: flex; gap: 0.5rem; }
    .btn-delete {
      background: #e74c3c; color: #fff; border: none;
      border-radius: 5px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.85rem;
    }
    .btn-delete:hover { background: #c0392b; }
    .empty { text-align: center; color: #aaa; margin-top: 2rem; font-size: 1rem; }
    .error-msg { color: #e74c3c; font-size: 0.85rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Task Manager</h1>
    <div class="form-card">
      <p id="form-error" class="error-msg" style="display:none"></p>
      <input type="text" id="task-title" placeholder="Task title *" />
      <textarea id="task-desc" rows="2" placeholder="Description (optional)"></textarea>
      <button onclick="addTask()">Add Task</button>
    </div>
    <div class="task-list" id="task-list"></div>
    <p class="empty" id="empty-msg" style="display:none">No tasks yet. Add one above!</p>
  </div>

  <script>
    const API = '/tasks';

    async function fetchTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      renderTasks(tasks);
    }

    function renderTasks(tasks) {
      const list = document.getElementById('task-list');
      const empty = document.getElementById('empty-msg');
      list.innerHTML = '';
      if (tasks.length === 0) { empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      tasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card' + (task.completed ? ' completed' : '');
        card.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id}, this.checked)" />
          <div class="task-info">
            <div class="task-title">${escapeHtml(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
          </div>
          <div class="task-actions">
            <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-desc').value.trim();
      const errorEl = document.getElementById('form-error');

      if (!title) {
        errorEl.textContent = 'Title is required.';
        errorEl.style.display = 'block';
        return;
      }
      errorEl.style.display = 'none';

      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
      });

      document.getElementById('task-title').value = '';
      document.getElementById('task-desc').value = '';
      fetchTasks();
    }

    async function toggleTask(id, completed) {
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    fetchTasks();
  </script>
</body>
</html>
