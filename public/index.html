<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container { width: 100%; max-width: 640px; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 1.5rem; font-size: 2rem; }
    .card {
      background: #fff; border-radius: 10px; padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.1rem; color: #555; margin-bottom: 1rem; }
    input, textarea {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1px solid #ddd; border-radius: 6px;
      font-size: 0.95rem; margin-bottom: 0.75rem;
    }
    input:focus, textarea:focus { outline: none; border-color: #3498db; }
    textarea { resize: vertical; min-height: 70px; }
    button {
      padding: 0.6rem 1.2rem; border: none; border-radius: 6px;
      cursor: pointer; font-size: 0.9rem; font-weight: 600;
    }
    .btn-primary { background: #3498db; color: #fff; width: 100%; }
    .btn-primary:hover { background: #2980b9; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    #error-msg { color: #e74c3c; font-size: 0.85rem; margin-bottom: 0.5rem; display: none; }
    .task-list { list-style: none; }
    .task-item {
      background: #fff; border-radius: 8px; padding: 1rem 1.2rem;
      margin-bottom: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      display: flex; align-items: flex-start; gap: 0.75rem;
    }
    .task-item.completed .task-title { text-decoration: line-through; color: #aaa; }
    .task-check { margin-top: 3px; width: 18px; height: 18px; cursor: pointer; accent-color: #2ecc71; }
    .task-body { flex: 1; }
    .task-title { font-weight: 600; color: #2c3e50; margin-bottom: 0.2rem; }
    .task-desc { font-size: 0.85rem; color: #777; }
    .task-meta { font-size: 0.75rem; color: #bbb; margin-top: 0.3rem; }
    .task-actions { margin-top: 0.5rem; }
    .empty-msg { text-align: center; color: #aaa; padding: 2rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div class="card">
      <h2>Nueva Tarea</h2>
      <p id="error-msg"></p>
      <input type="text" id="task-title" placeholder="Titulo de la tarea *" />
      <input type="text" id="task-creator" placeholder="Tu nombre (creador) *" />
      <textarea id="task-desc" placeholder="Descripcion (opcional)"></textarea>
      <button class="btn-primary" onclick="createTask()">+ Agregar Tarea</button>
    </div>
    <ul class="task-list" id="task-list"></ul>
  </div>

  <script>
    const API = '/tasks';

    async function fetchTasks() {
      const res = await fetch(API);
      renderTasks(await res.json());
    }

    function renderTasks(tasks) {
      const list = document.getElementById('task-list');
      if (!tasks.length) {
        list.innerHTML = '<p class="empty-msg">No hay tareas. Crea una!</p>';
        return;
      }
      list.innerHTML = tasks.map(t => `
        <li class="task-item ${t.completed ? 'completed' : ''}">
          <input class="task-check" type="checkbox" ${t.completed ? 'checked' : ''}
            onchange="toggleTask(${t.id}, this.checked)" />
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
            <div class="task-meta">Creada por: <strong>${esc(t.createdBy)}</strong> &middot; ${new Date(t.createdAt).toLocaleString()}</div>
            <div class="task-actions">
              <button class="btn-danger" onclick="deleteTask(${t.id})">Eliminar</button>
            </div>
          </div>
        </li>`).join('');
    }

    async function createTask() {
      const title = document.getElementById('task-title').value.trim();
      const createdBy = document.getElementById('task-creator').value.trim();
      const description = document.getElementById('task-desc').value.trim();
      const errEl = document.getElementById('error-msg');
      if (!title) {
        errEl.textContent = 'El titulo es obligatorio.';
        errEl.style.display = 'block';
        return;
      }
      if (!createdBy) {
        errEl.textContent = 'El nombre del creador es obligatorio.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, createdBy })
      });
      document.getElementById('task-title').value = '';
      document.getElementById('task-creator').value = '';
      document.getElementById('task-desc').value = '';
      fetchTasks();
    }

    async function toggleTask(id, completed) {
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTasks();
    }

    async function deleteTask(id) {
      if (!confirm('Eliminar esta tarea?')) return;
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    fetchTasks();
  </script>
</body>
</html>
