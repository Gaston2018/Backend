stages:
  - install
  - test
  - analyze

variables:
  NODE_VERSION: "20"

# ─── Install ────────────────────────────────────────────────────────────────
install_dependencies:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ─── Test ───────────────────────────────────────────────────────────────────
run_tests:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs: [install_dependencies]
  script:
    - npm test
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - coverage/
    expire_in: 7 days

# ─── SonarQube Analysis ─────────────────────────────────────────────────────
sonarqube_analysis:
  stage: analyze
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs: [run_tests]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
        -Dsonar.host.url=${SONAR_HOST_URL}
        -Dsonar.token=${SONAR_TOKEN}
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  allow_failure: true
  rules:
    - if: $SONAR_HOST_URL && $SONAR_TOKEN
